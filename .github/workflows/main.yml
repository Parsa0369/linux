
name: Linux Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Update system and install RDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xrdp \
            xfce4 \
            xfce4-goodies \
            dbus-x11

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: 2. Create RDP User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          sudo useradd -m -s /bin/bash NvDAdmin || true
          echo "NvDAdmin:$RDP_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo NvDAdmin

          echo "startxfce4" | sudo tee /home/NvDAdmin/.xsession
          sudo chown NvDAdmin:NvDAdmin /home/NvDAdmin/.xsession
          sudo chmod 600 /home/NvDAdmin/.xsession

      - name: 3. Configure XFCE for XRDP
        run: |
          sudo sed -i 's/^test -x/#test -x/' /etc/xrdp/startwm.sh
          sudo sed -i 's/^exec/#exec/' /etc/xrdp/startwm.sh

          sudo tee -a /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/share
          startxfce4
          EOF

          sudo systemctl restart xrdp

      - name: 4. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --auth-key="${TAILSCALE_AUTHKEY}" \
            --hostname="github-linux-rdp"

          sleep 5

          TS_IP=$(tailscale ip -4)

          echo ""
          echo "=================================================="
          echo "       >>> LINUX RDP SERVER READY <<<"
          echo "=================================================="
          echo "Tailscale IP : $TS_IP"
          echo "Username     : NvDAdmin"
          echo "RDP Port     : 3389"
          echo "=================================================="

      - name: 5. Keep Server Alive
        run: |
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360] Linux RDP running..."
          done
