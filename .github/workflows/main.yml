name: Linux Cloud RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: 1. Install XFCE + XRDP
        run: |
          sudo apt-get update -y

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xrdp \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            openssl

          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: 2. Create RDP User
        id: credentials
        run: |
          USERNAME="NvDAdmin"

          # Generate exactly 8 characters
          PASSWORD=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 8)

          sudo useradd -m -s /bin/bash "$USERNAME" 2>/dev/null || true

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          echo "startxfce4" | sudo tee /home/$USERNAME/.xsession > /dev/null

          sudo chown "$USERNAME:$USERNAME" /home/$USERNAME/.xsession
          sudo chmod 600 /home/$USERNAME/.xsession

          echo "USERNAME=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "PASSWORD=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: 3. Configure XRDP
        run: |
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export XDG_SESSION_DESKTOP=xfce
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/share

          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo systemctl restart xrdp

      - name: 4. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY is missing!"
            echo "Add your Tailscale Auth Key to GitHub Secrets."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-rdp"

          sleep 5

      - name: 5. Show RDP Information
        run: |
          TAILSCALE_IP=$(sudo tailscale ip -4)

          echo ""
          echo "=================================================="
          echo "              LINUX RDP READY"
          echo "=================================================="
          echo ""
          echo "Tailscale IP : $TAILSCALE_IP"
          echo ""
          echo "Username     : ${{ steps.credentials.outputs.USERNAME }}"
          echo ""
          echo "Password     : ${{ steps.credentials.outputs.PASSWORD }}"
          echo ""
          echo "RDP Port     : 3389"
          echo ""
          echo "=================================================="
          echo "Connect with Microsoft Remote Desktop"
          echo "=================================================="

      - name: 6. Keep Server Alive
        run: |
          echo "RDP server is running..."

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Server running..."
            sleep 60
          done
