name: Linux Cloud RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-latest

    steps:

      - name: 1. Update System
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y

      - name: 2. Install XFCE and XRDP
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xrdp \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            openssl

          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: 3. Create RDP User and Password
        id: credentials
        run: |
          USERNAME="NvDAdmin"

          PASSWORD=$(openssl rand -base64 20 | tr -dc 'A-Za-z0-9' | head -c 12)

          sudo useradd -m -s /bin/bash "$USERNAME" 2>/dev/null || true

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          echo "startxfce4" | sudo tee "/home/$USERNAME/.xsession" > /dev/null
          sudo chown "$USERNAME:$USERNAME" "/home/$USERNAME/.xsession"
          sudo chmod 600 "/home/$USERNAME/.xsession"

          echo "USERNAME=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "PASSWORD=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: 4. Configure XRDP
        run: |
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          export XDG_SESSION_DESKTOP=xfce
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/share

          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh
          sudo systemctl restart xrdp

      - name: 5. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY secret is missing."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-rdp"

      - name: 6. Get Tailscale IP
        run: |
          echo ""
          echo "=========================================="
          echo "       LINUX RDP IS READY"
          echo "=========================================="
          echo ""

          echo "RDP IP:"
          sudo tailscale ip -4

          echo ""
          echo "RDP USERNAME:"
          echo "NvDAdmin"

          echo ""
          echo "RDP PASSWORD:"
          echo "${{ steps.credentials.outputs.PASSWORD }}"

          echo ""
          echo "RDP PORT:"
          echo "3389"

          echo ""
          echo "=========================================="
          echo "Connect using Microsoft Remote Desktop"
          echo "=========================================="

      - name: 7. Keep RDP Alive
        run: |
          echo "RDP server is running..."

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] RDP still running..."
            sleep 60
          done
